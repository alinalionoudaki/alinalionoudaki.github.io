  <script>
    // =========================================================================
    // 1. INITIAL DATA: USERS, FEK, ΤΥΠΟΛΟΓΙΟ & ΔΙΑΦΟΡΕΣ, ΚΕΦΑΛΑΙΑ 1-7, ΔΙΑΓΩΝΙΣΜΑΤΑ
    // =========================================================================

    const DEFAULT_USERS = [

      { id: 'u_st1', username: 'kostas', password: '123', fullName: 'Κώστας Παπαδόπουλος', role: 'student', active: true },
      { id: 'u_st2', username: 'ioanna', password: '123', fullName: 'Ιωάννα Κωνσταντίνου', role: 'student', active: true },

    const TYPOLOGIO_DATA = {
      operators: [
        { op: '<-', name: 'Εκχώρηση τιμής', example: 'χ <- 5 + 2', notes: 'Αποδίδει την τιμή της δεξιάς έκφρασης στη μεταβλητή αριστερά.' },

        { op: '-', name: 'Αφαίρεση / Πρόσημο', example: 'α - β', notes: 'Αριθμητική αφαίρεση.' },
        { op: '*', name: 'Πολλαπλασιασμός', example: 'α * β', notes: 'Προηγείται της πρόσθεσης και αφαίρεσης.' },

        { op: 'DIV', name: 'Ακέραιο Πηλίκο', example: '17 DIV 5 = 3', notes: 'Εφαρμόζεται ΜΟΝΟ σε ακεραίους. Επιστρέφει το ακέραιο πηλίκο.' },

      algorithms: [
        {
          title: '1. Αντιμετάθεση (Swap)',

        },
        {
          title: '5. Ταξινόμηση Φυσαλίδας (Αύξουσα)',

          title: '6. Δευτερεύουσα Διαγώνιος Π[Ν, Ν]',

      ],
      comparison: [
        { criterion: 'Ορισμός & Φύση', algo: 'Αφηρημένη λογική διαδικασία επίλυσης ενός προβλήματος σε πεπερασμένα βήματα.', prog: 'Συγκεκριμένη υλοποίηση ενός αλγορίθμου σε μια γλώσσα προγραμματισμού (π.χ. ΓΛΩΣΣΑ, Python).' },

        { criterion: 'Γλώσσα Διατύπωσης', algo: 'Ελεύθερο κείμενο, Διάγραμμα Ροής, Φυσική γλώσσα κατά βήματα ή Ψευδογλώσσα.', prog: 'Αυστηρά καθορισμένη τεχνητή γλώσσα προγραμματισμού με συγκεκριμένο λεξιλόγιο και συντακτικό.' },
        { criterion: 'Συντακτικοί Κανόνες', algo: 'Ευέλικτοι κανόνες, χωρίς αυστηρούς περιορισμούς μεταγλωττιστή.', prog: 'Αυστηροί συντακτικοί και σημασιολογικοί κανόνες (ένα λάθος εμποδίζει τη μεταγλώττιση).' },

    const FEK_INFO = {

        { theme: "Θέμα Β (25 μονάδες)", desc: "Ανάλυση & Ιχνηλάτηση: Πίνακας τιμών (trace table), εντοπισμός & διόρθωση συντακτικών/λογικών λαθών, μετατροπή δομών, Στοίβα/Ουρά/Λίστες/Δέντρα." },
        { theme: "Θέμα Γ (25 μονάδες)", desc: "Ανάπτυξη Προγράμματος στη ΓΛΩΣΣΑ: Επίλυση προβλήματος με δομές ελέγχου, μετρητές, αθροιστές, μονοδιάστατους πίνακες και έλεγχο εγκυρότητας." },

        { ch: "Κεφ. 2", title: "Εισαγωγή στον Προγραμματισμό (Πρόγραμμα, Φυσικές/Τεχνητές γλώσσες, Ιεραρχική σχεδίαση, OOP, Περιβάλλοντα)", status: "Εντός Ύλης" },
        { ch: "Κεφ. 3", title: "Βασικές Έννοιες Προγραμματισμού & Επαναληπτικές Σημειώσεις Δομών Δεδομένων, Πινάκων, Αναζήτησης & Ταξινόμησης", status: "Εντός Ύλης (Εμπλουτισμένο)" },
        { ch: "Κεφ. 4", title: "Δομή Ακολουθίας (Αλγόριθμος, Διάγραμμα Ροής, Μεθοδολογία, Ποσοστά, DIV/MOD)", status: "Εντός Ύλης" },
        { ch: "Κεφ. 5", title: "Δομή Επιλογής (Απλή, Σύνθετη, Πολλαπλή, Μετατροπές, ΕΠΕΛΕΞΕ, Εμφωλευμένες, Κλιμακωτή χρέωση)", status: "Εντός Ύλης" },

      ]

    // =========================================================================

    // =========================================================================

    const DEFAULT_CHAPTERS = [

        icon: "🧩",
        description: "Κατανόηση της έννοιας του προβλήματος, διατύπωση απαιτήσεων και ιεραρχική δόμηση σε υποπροβλήματα.",
        subsections: [
          {
            id: "ch1_s1",
            title: "1.1 Η έννοια του προβλήματος",
            summary: `
              <p class="mb-2"><strong>Πρόβλημα</strong> ονομάζεται κάθε κατάσταση η οποία απαιτεί αντιμετώπιση ή λύση, αλλά η λύση της δεν είναι άμεσα προφανής.</p>
              <ul class="list-disc pl-5 space-y-1 text-slate-700">
                <li><strong>Κατηγορίες προβλημάτων:</strong> <em>Επιλύσιμα</em> (υπάρχει γνωστή μέθοδος λύσης), <em>Ανοικτά</em> (δεν έχει βρεθεί ακόμα λύση αλλά δεν έχει αποδειχθεί ότι είναι άλυτα) και <em>Άλυτα</em> (αποδεδειγμένα δεν επιδέχονται λύση, π.χ. τετραγωνισμός κύκλου).</li>

            summary: `

              <div class="grid sm:grid-cols-3 gap-2.5 mt-2">
                <div class="bg-indigo-50 p-3 rounded-xl border border-indigo-100">
                  <div class="font-bold text-indigo-900 text-xs">1. Δεδομένα (Είσοδος)</div>

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white',
        info: 'bg-indigo-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        error: 'bg-rose-600 text-white'
      };
      el.className = `${styles[type] || styles.info} px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all transform translate-y-2 opacity-0 pointer-events-auto`;
      el.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⛔' : type === 'warning' ? '⚠️' : 'ℹ️'}</span><span>${msg}</span>`;
      box.appendChild(el);
      requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

        showToast('Ο λογαριασμός σας έχει απενεργοποιηθεί από τον εκπαιδευτικό.', 'error');
        return;
      }
      state.currentUser = found;
      state.activeNav = found.role === 'teacher' ? 'admin' : 'home';
      persistAll();
      showToast(`Καλώς ήρθες, ${found.fullName}!`, 'success');
      render();
    }

        return;

      showToast(`Άμεση είσοδος ως: ${found.fullName}`, 'info');

      showToast(user.active ? `Ενεργοποιήθηκε η πρόσβαση για: ${user.fullName}` : `Απενεργοποιήθηκε η πρόσβαση για: ${user.fullName}`, 'info');
      render();

      state.users = state.users.filter(u => u.id !== userId);
      persistAll();

      state.teacherEmail = val.trim() || 'alinalion24@gmail.com';

      showToast(`Το Email εκπαιδευτικού ορίστηκε σε: ${state.teacherEmail}`, 'success');
    }

    function enrichContentSubmit(e) {
      e.preventDefault();
      const chId = document.getElementById('enrich-chapter').value;
      const type = document.getElementById('enrich-type').value;
      const title = document.getElementById('enrich-title').value.trim();
      const body = document.getElementById('enrich-body').value.trim();
      const extra = document.getElementById('enrich-extra').value.trim();

      if (!title || !body) {
        showToast('Συμπλήρωσε τίτλο και περιεχόμενο!', 'warning');
        return;
      }

      const chapter = state.chapters.find(c => c.id === chId);
      if (!chapter) return;

      if (type === 'theory') {
        chapter.subsections.push({
          id: 'sub_' + Date.now(),
          title: title,
          summary: `<p class="whitespace-pre-line">${body}</p>${extra ? `<pre class="mt-2 bg-slate-900 text-emerald-300 p-3 rounded-xl text-xs code-font overflow-x-auto">${extra}</pre>` : ''}`
        });
      } else if (type === 'tf') {
        chapter.theoryExercises.trueFalse.push({
          id: 'tf_' + Date.now(),
          statement: body,
          correct: extra.toLowerCase().startsWith('σ') || extra.toLowerCase() === 'true',
          hint: title
        });
      } else if (type === 'code') {
        chapter.practicalExercises.codeCreation = {
          title: title,
          prompt: body,
          starter: "ΠΡΟΓΡΑΜΜΑ Νέα_Άσκηση\nΜΕΤΑΒΛΗΤΕΣ\n  ...\nΑΡΧΗ\n  ...\nΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ",
          solution: extra || "Ενδεικτική λύση καταχωρημένη από τον εκπαιδευτικό."
        };
      } else if (type === 'test_q') {
        const opts = extra.split('|').map(s => s.trim()).filter(Boolean);
        if (opts.length < 2) {
          showToast('Για ερώτηση τεστ βάλε επιλογές χωρισμένες με | (π.χ. Επιλογή 1 | Επιλογή 2)', 'warning');
          return;
        }
        chapter.tests[0].questions.push({
          q: body,
          options: opts,
          correct: 0,
          errorReason: `Δυσκολία στην έννοια: ${title}`
        });
      }

      persistAll();
      showToast('Το νέο εκπαιδευτικό υλικό προστέθηκε στο κεφάλαιο!', 'success');
      document.getElementById('enrich-title').value = '';
      document.getElementById('enrich-body').value = '';
      document.getElementById('enrich-extra').value = '';
    }

    function setNav(nav, chId = null, tab = null) {
      state.activeNav = nav;
      if (chId) {
        state.selectedChapterId = chId;
        const ch = state.chapters.find(c => c.id === chId);
        if (ch && ch.subsections.length > 0) state.selectedSubId = ch.subsections[0].id;
        state.activeTestIndex = 0;

      if (tab) state.chapterTab = tab;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openEmailReportModal(logId) {
      const log = state.logs.find(l => l.id === logId);
      if (!log) return;

      const mistakesText = log.mistakes && log.mistakes.length > 0
        ? log.mistakes.map((m, i) => `${i + 1}. Ερώτηση: ${m.question}\n   - Απάντηση μαθητή: ${m.studentAns}\n   - Σωστή απάντηση: ${m.correctAns}\n   - Πιθανή αιτία λάθους: ${m.reason}`).join('\n\n')
        : 'Κανένα λάθος! Άριστη κατανόηση της ενότητας.';

      const emailBody = `Αναφορά Αξιολόγησης ΑΕΠΠ (Γ' Λυκείου)\n` +
        `--------------------------------------------------\n` +
        `Μαθητής/τρια: ${log.studentName}\n` +
        `Ενότητα: ${log.chapterTitle}\n` +
        `Διαγνωστικό Τεστ: ${log.testTitle}\n` +
        `Βαθμολογία: ${log.score}% (${log.correct}/${log.total} σωστές απαντήσεις)\n` +
        `Ημερομηνία/Ώρα: ${log.date}\n\n` +
        `ΑΝΑΛΥΣΗ ΛΑΘΩΝ & ΔΙΑΓΝΩΣΤΙΚΟ FEEDBACK:\n${mistakesText}\n` +
        `--------------------------------------------------\n` +
        `Αυτόματη αναφορά από την πλατφόρμα ΑΕΠΠ Πανελλαδικές (ΦΕΚ Β' 4210/2026).`;

      state.lastEmailReportText = emailBody;

      const subject = encodeURIComponent(`[ΑΕΠΠ Αξιολόγηση] ${log.studentName} - ${log.testTitle} (${log.score}%)`);
      const bodyEncoded = encodeURIComponent(emailBody);
      const mailtoHref = `mailto:${state.teacherEmail}?subject=${subject}&body=${bodyEncoded}`;

      document.getElementById('email-modal-body').innerHTML = `
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs space-y-1">
          <div><strong class="text-slate-500">Προς (Email Εκπαιδευτικού):</strong> <span class="font-mono font-bold text-indigo-700">${state.teacherEmail}</span></div>
          <div><strong class="text-slate-500">Θέμα:</strong> [ΑΕΠΠ Αξιολόγηση] ${log.studentName} - ${log.testTitle} (${log.score}%)</div>
        </div>
        <pre class="bg-slate-900 text-slate-100 p-4 rounded-2xl text-xs whitespace-pre-wrap leading-relaxed font-sans">${emailBody}</pre>
      `;

      document.getElementById('mailto-trigger-link').href = mailtoHref;
      document.getElementById('email-modal').classList.remove('hidden');
      document.getElementById('email-modal').classList.add('flex');
    }

    function closeEmailModal() {
      document.getElementById('email-modal').classList.add('hidden');
      document.getElementById('email-modal').classList.remove('flex');
    }

    function copyEmailReport() {
      const ta = document.createElement('textarea');
      ta.value = state.lastEmailReportText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('Η αναφορά αντιγράφηκε στο πρόχειρο!', 'success');

    function renderTheoreticalExercisesTab(ch) {
      const te = ch.theoryExercises;
      const rightOptions = te.matching.map(m => m.right);
      const showAllKey = `show_all_tf_${ch.id}`;
      const isAllRevealed = !!state.tfAnswers[showAllKey];

      return `
        <div class="space-y-8">
          <!-- 1. TRUE / FALSE WITH SOLUTIONS FOR STUDENTS -->
          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div>

              </div>
              <button onclick="toggleRevealAllTF('${ch.id}')"
                      class="px-4 py-2 rounded-xl font-bold text-xs transition shadow-sm ${isAllRevealed ? 'bg-slate-800 text-white hover:bg-slate-900' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                ${isAllRevealed ? '🙈 Απόκρυψη Λύσεων Μελέτης' : '💡 Εμφάνιση Όλων των Λύσεων & Αιτιολογήσεων'}
              </button>
            </div>

            <div class="space-y-3">
              ${te.trueFalse.map((item, idx) => {
                const ans = state.tfAnswers[item.id];
                const isAnswered = ans !== undefined;
                const isRight = ans === item.correct;
                const showSolution = isAnswered || isAllRevealed;
                return `
                  <div class="bg-white p-4 rounded-xl border ${isAnswered ? (isRight ? 'border-emerald-300' : 'border-rose-300') : (isAllRevealed ? 'border-indigo-200' : 'border-slate-200')}">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <p class="text-sm font-medium text-slate-800"><strong>${idx + 1}.</strong> ${item.statement}</p>
                      <div class="flex items-center gap-2 shrink-0">
                        <button onclick="answerTF('${item.id}', true)" class="px-3.5 py-1.5 rounded-lg text-xs font-bold border transition ${ans === true ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-300'}">
                          Σωστό
                        </button>
                        <button onclick="answerTF('${item.id}', false)" class="px-3.5 py-1.5 rounded-lg text-xs font-bold border transition ${ans === false ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-300'}">
                          Λάθος
                        </button>
                      </div>
                    </div>
                    ${showSolution ? `
                      <div class="mt-2.5 p-2.5 rounded-lg text-xs font-semibold ${isAnswered ? (isRight ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200') : 'bg-indigo-50 text-indigo-900 border border-indigo-200'}">
                        ${isAnswered ? (isRight ? '✅ Σωστή επιλογή! ' : '❌ Λάθος επιλογή. ') : '📘 Λύση: '}
                        <span class="underline font-extrabold">${item.correct ? 'ΣΩΣΤΟ' : 'ΛΑΘΟΣ'}</span> — ${item.hint}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- 2. MATCHING -->
          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
            <h3 class="text-base font-extrabold text-slate-900 mb-3">2️⃣ Άσκηση Αντιστοίχισης</h3>
            <div class="space-y-3">
              ${te.matching.map((m, idx) => {
                const chosen = state.matchAnswers[m.id] || '';
                const isChecked = chosen !== '';
                const isRight = chosen === m.right;
                return `

    // --- TAB 4: 2-3 DIAGNOSTIC TESTS PER CHAPTER WITH EMAIL FEEDBACK ---
    function renderChapterTestsTab(ch) {
      const test = ch.tests[state.activeTestIndex] || ch.tests[0];
      const isSubmitted = !!state.testSubmitted[test.id];
      const selections = state.testSelections[test.id] || {};

      let correctCount = 0;
      if (isSubmitted) {
        test.questions.forEach((q, i) => { if (selections[i] === q.correct) correctCount++; });
      }
      const score = Math.round((correctCount / test.questions.length) * 100);

      return `
        <div class="space-y-6">
          <!-- Test Switcher (Τεστ 1, Τεστ 2, Τεστ 3) -->
          <div class="flex flex-wrap items-center justify-between gap-3 bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100">
            <div class="flex flex-wrap gap-2">
              ${ch.tests.map((t, idx) => `
                <button onclick="selectChapterTest(${idx})"
                        class="px-4 py-2 rounded-xl text-xs font-extrabold transition ${idx === state.activeTestIndex ? 'bg-indigo-600 text-white shadow' : 'bg-white text-indigo-700 border border-indigo-200 hover:bg-indigo-100'}">
                  🎯 ${t.title.split(':')[0]}
                </button>
              `).join('')}
            </div>
            <div class="text-xs text-indigo-900 font-semibold">
              Αυτόματη βαθμολόγηση & αποστολή αναφοράς στον καθηγητή
            </div>
          </div>

          <!-- Active Test Card -->
          <div class="border border-slate-200 rounded-2xl p-5 sm:p-6 bg-white">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-slate-100">
              <div>
                <h3 class="text-lg font-extrabold text-slate-900">${test.title}</h3>
                <p class="text-xs text-slate-500">Επίλεξε τη σωστή απάντηση σε κάθε ερώτηση και πάτησε Υποβολή.</p>
              </div>
              ${isSubmitted ? `
                <div class="flex flex-wrap items-center gap-2">
                  <span class="px-3.5 py-1.5 rounded-xl font-extrabold text-sm ${score >= 70 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                    Βαθμολογία: ${score}% (${correctCount}/${test.questions.length})
                  </span>
                  <button onclick="retryChapterTest('${test.id}')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-700">
                    🔄 Επανάληψη
                  </button>
                </div>
              ` : ''}
            </div>

            <div class="space-y-4">
              ${test.questions.map((q, qIdx) => {
                const chosen = selections[qIdx];
                return `
                  <div class="p-4 rounded-xl border ${isSubmitted ? (chosen === q.correct ? 'border-emerald-300 bg-emerald-50/20' : 'border-rose-300 bg-rose-50/20') : 'border-slate-200'}">
                    <p class="font-bold text-sm text-slate-900 mb-3">${qIdx + 1}. ${q.q}</p>
                    <div class="grid sm:grid-cols-2 gap-2">
                      ${q.options.map((opt, oIdx) => {
                        let cls = 'border-slate-200 bg-slate-50 hover:border-indigo-300 text-slate-700';
                        if (!isSubmitted && chosen === oIdx) cls = 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold ring-2 ring-indigo-200';
                        if (isSubmitted) {
                          if (oIdx === q.correct) cls = 'border-emerald-500 bg-emerald-100 text-emerald-950 font-bold';
                          else if (chosen === oIdx) cls = 'border-rose-500 bg-rose-100 text-rose-950 line-through';
                        }
                        return `
                          <button type="button" ${isSubmitted ? 'disabled' : ''} onclick="pickTestOption('${test.id}', ${qIdx}, ${oIdx})"
                                  class="text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition ${cls}">
                            ${opt}
                          </button>
                        `;
                      }).join('')}
                    </div>
                    ${isSubmitted ? `
                      <div class="mt-2.5 text-xs ${chosen === q.correct ? 'text-emerald-800 bg-emerald-100/70' : 'text-rose-800 bg-rose-100/70'} p-2.5 rounded-lg">
                        <strong>${chosen === q.correct ? 'Επεξήγηση:' : 'Διάγνωση:'}</strong> ${q.errorReason}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
              ${!isSubmitted ? `
                <button onclick="submitChapterTest('${ch.id}', '${test.id}')" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-md shadow-indigo-200 transition">
                  ✅ Υποβολή Τεστ & Υπολογισμός Βαθμού
                </button>
              ` : `
                <button onclick="openEmailReportModal('${state.logs[0]?.id}')" class="px-5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs sm:text-sm transition flex items-center gap-2">
                  📧 Αποστολή Αναφοράς & Feedback στον Καθηγητή (${state.teacherEmail})
                </button>
              `}
            </div>
          </div>
        </div>
      `;
    }

    function selectChapterTest(idx) { state.activeTestIndex = idx; render(); }
    function pickTestOption(testId, qIdx, oIdx) {
      if (!state.testSelections[testId]) state.testSelections[testId] = {};
      state.testSelections[testId][qIdx] = oIdx;
      render();
    }
    function retryChapterTest(testId) {
      delete state.testSelections[testId];
      delete state.testSubmitted[testId];
      render();
    }

    function submitChapterTest(chId, testId) {
      const ch = state.chapters.find(c => c.id === chId);
      const test = ch.tests.find(t => t.id === testId);
      const sel = state.testSelections[testId] || {};

      if (Object.keys(sel).length < test.questions.length) {
        showToast('Απάντησε σε όλες τις ερωτήσεις πριν την υποβολή!', 'warning');
        return;
      }

      state.testSubmitted[testId] = true;
      let correct = 0;
      const mistakes = [];

      test.questions.forEach((q, idx) => {
        if (sel[idx] === q.correct) {
          correct++;
        } else {
          mistakes.push({
            question: q.q,
            studentAns: q.options[sel[idx]],
            correctAns: q.options[q.correct],
            reason: q.errorReason
          });
        }
      });

      const score = Math.round((correct / test.questions.length) * 100);
      const now = new Date();
      const dateStr = `Σήμερα, ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const newLog = {
        id: 'lg_' + Date.now(),
        studentName: state.currentUser.fullName,
        chapterTitle: `${ch.num}: ${ch.title}`,
        testTitle: test.title,
        score,
        correct,
        total: test.questions.length,
        date: dateStr,
        mistakes
      };

      state.logs.unshift(newLog);
      persistAll();
      showToast(`Βαθμολογία: ${score}%! Έτοιμη η αναφορά feedback για αποστολή στον καθηγητή.`, 'success');
      render();
    }

                <div class="p-6 space-y-5">
                  ${ex.questions.map(q => `
                    <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200">
                      <div class="text-xs font-extrabold text-indigo-700 uppercase mb-1">${q.type}</div>

    function toggleSimTimer(exId) {
      const es = state.examState[exId];
      es.running = !es.running;
      if (timerHandle) clearInterval(timerHandle);
      if (es.running) {
        timerHandle = setInterval(() => {
          if (es.seconds > 0 && es.running) {
            es.seconds--;
            const el = document.getElementById(`ex-timer-${exId}`);
            if (el) {
              const h = Math.floor(es.seconds / 3600);
              const m = Math.floor((es.seconds % 3600) / 60);
              const s = es.seconds % 60;
              el.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }
          }
        }, 1000);
      }
      render();
    }

    function updateSimAns(exId, qId, val) {
      state.examState[exId].answers[qId] = val;
    }

    function submitSimExam(exId) {
      if (timerHandle) clearInterval(timerHandle);
      const es = state.examState[exId];
      es.running = false;
      es.submitted = true;
      showToast('Το διαγώνισμα υποβλήθηκε! Οι ενδεικτικές απαντήσεις ξεκλειδώθηκαν.', 'success');
      render();
    }

              <div class="flex gap-2">
                <input type="email" value="${state.teacherEmail}" onchange="updateTeacherEmail(this.value)"
                       class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-600 text-xs font-mono text-emerald-300 outline-none focus:border-indigo-500" />
              </div>
            </div>
          </div>

          <div class="grid lg:grid-cols-2 gap-6">
            <!-- 1. STUDENT ACCOUNT MANAGEMENT (CREATE, BLOCK, DELETE) -->
            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-5">
              <div>
                <h2 class="text-lg font-extrabold text-slate-900">👥 Διαχείριση Χρηστών & Μαθητών</h2>
                <p class="text-xs text-slate-500">Δημιουργήστε κωδικούς για νέους μαθητές ή διαγράψτε όσους δεν θέλετε να έχουν πρόσβαση.</p>
              </div>

              <!-- Add New Student Form -->
              <form onsubmit="addNewStudent(event)" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                <div class="text-xs font-extrabold text-indigo-700 uppercase">+ Προσθήκη Νέου Μαθητή</div>
                <div class="grid sm:grid-cols-3 gap-2">
                  <input type="text" id="new-st-name" placeholder="Ονοματεπώνυμο" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white outline-none" />
                  <input type="text" id="new-st-user" placeholder="Username" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white outline-none" />
                  <input type="text" id="new-st-pass" placeholder="Κωδικός" class="px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white outline-none" />
                </div>
                <button type="submit" class="w-full py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition">
                  Δημιουργία Λογαριασμού Μαθητή
                </button>
              </form>

              <!-- Registered Students List -->
              <div class="space-y-2.5">
                <div class="text-xs font-bold text-slate-500">Εγγεγραμμένοι Μαθητές (${students.length}):</div>
                ${students.map(st => `
                  <div class="p-3.5 rounded-2xl border ${st.active ? 'border-slate-200 bg-white' : 'border-rose-200 bg-rose-50/50'} flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div class="font-bold text-sm text-slate-900 flex items-center gap-2">
                        <span>${st.fullName}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-full font-bold ${st.active ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                          ${st.active ? 'Ενεργός' : 'Φραγή'}
                        </span>
                      </div>
                      <div class="text-xs text-slate-500 font-mono">user: <strong>${st.username}</strong> • pass: <strong>${st.password}</strong></div>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <button onclick="toggleUserStatus('${st.id}')" class="px-2.5 py-1.5 rounded-lg bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-[11px] transition">
                        ${st.active ? '⏸️ Φραγή' : '▶️ Ενεργοποίηση'}
                      </button>
                      <button onclick="deleteUser('${st.id}')" class="px-2.5 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-bold text-[11px] transition">
                        🗑️ Διαγραφή
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- 2. CONTENT ENRICHMENT FORM -->
            <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-4">
              <div>
                <h2 class="text-lg font-extrabold text-slate-900">✍️ Εμπλουτισμός Εκπαιδευτικού Υλικού</h2>
                <p class="text-xs text-slate-500">Προσθέστε νέες σημειώσεις θεωρίας, ασκήσεις Σ/Λ, ασκήσεις κώδικα ή ερωτήσεις τεστ σε οποιοδήποτε κεφάλαιο.</p>
              </div>

              <form onsubmit="enrichContentSubmit(event)" class="space-y-3">
                <div class="grid sm:grid-cols-2 gap-3">
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Επιλογή Κεφαλαίου</label>
                    <select id="enrich-chapter" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-slate-50 outline-none">
                      ${state.chapters.map(c => `<option value="${c.id}">${c.num}: ${c.title}</option>`).join('')}
                    </select>
                  </div>
                  <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Είδος Υλικού</label>
                    <select id="enrich-type" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-slate-50 outline-none">
                      <option value="theory">📖 Νέα Υποενότητα Θεωρίας</option>
                      <option value="tf">✓ Άσκηση Σωστού / Λάθους</option>
                      <option value="code">💻 Άσκηση Δημιουργίας Κώδικα</option>
                      <option value="test_q">🎯 Ερώτηση στο Τεστ Επανάληψης</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Τίτλος / Επεξήγηση (Hint)</label>
                  <input type="text" id="enrich-title" placeholder="π.χ. 7.9 Κυκλική Ουρά & Εφαρμογές"
                         class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs outline-none focus:border-indigo-500" />
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Κείμενο Θεωρίας / Εκφώνηση Άσκησης / Ερώτηση</label>
                  <textarea id="enrich-body" rows="3" placeholder="Γράψε το κείμενο ή την εκφώνηση..."
                            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs outline-none focus:border-indigo-500"></textarea>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1">Κώδικας ΓΛΩΣΣΑΣ / Λύση / Επιλογές Τεστ (χωρισμένες με | )</label>
                  <textarea id="enrich-extra" rows="2" placeholder="Για Σ/Λ γράψε 'Σωστό' ή 'Λάθος'. Για Τεστ γράψε: Σωστή επιλογή | Λάθος 1 | Λάθος 2"
                            class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs code-font outline-none focus:border-indigo-500"></textarea>
                </div>

                <button type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs sm:text-sm shadow transition">
                  ➕ Αποθήκευση & Δημοσίευση στο Κεφάλαιο
                </button>
              </form>
            </div>
          </div>

          <!-- 3. STUDENT FEEDBACK LOGS & EMAIL DISPATCH -->
          <div class="bg-white rounded-3xl border border-slate-200 p-6 shadow-sm space-y-5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h2 class="text-lg font-extrabold text-slate-900">📊 Αποτελέσματα Μαθητών, Διάγνωση Λαθών & Αποστολή Email</h2>
                <p class="text-xs text-slate-500">Κάθε τεστ που ολοκληρώνει ένας μαθητής καταγράφεται εδώ με ανάλυση αιτιών και δυνατότητα αποστολής στο <strong>${state.teacherEmail}</strong>.</p>
              </div>
            </div>

            <!-- Repeated Mistakes Diagnostic Box -->
            ${Object.keys(reasonCounts).length > 0 ? `
              <div class="bg-rose-50 border border-rose-200 rounded-2xl p-4">
                <div class="text-xs font-extrabold text-rose-900 uppercase mb-2">🧠 Εντοπισμένες Δυσκολίες & Αιτίες Λαθών Τμήματος:</div>
                <div class="grid sm:grid-cols-2 gap-2.5">
                  ${Object.entries(reasonCounts).map(([reason, cnt]) => `
                    <div class="bg-white p-3 rounded-xl border border-rose-200 text-xs">
                      <span class="font-bold text-rose-700">[${cnt}x]</span> <span class="text-slate-800">${reason}</span>
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="space-y-3">
              ${state.logs.map(log => `
                <div class="p-4 rounded-2xl border border-slate-200 hover:border-indigo-200 transition">
                  <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                    <div>
                      <span class="font-extrabold text-sm text-slate-900">${log.studentName}</span>
                      <span class="text-xs text-slate-500"> • ${log.chapterTitle} • <strong>${log.testTitle}</strong></span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs text-slate-400">${log.date}</span>
                      <span class="px-2.5 py-1 rounded-full text-xs font-extrabold ${log.score >= 70 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                        Σκορ: ${log.score}%
                      </span>
                      <button onclick="openEmailReportModal('${log.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition">
                        📧 Αποστολή Email
                      </button>
                    </div>
                  </div>
                  ${log.mistakes && log.mistakes.length > 0 ? `
                    <div class="mt-2 space-y-1.5">
                      ${log.mistakes.map(m => `
                        <div class="bg-slate-50 p-2.5 rounded-xl text-xs text-slate-700">
                          <strong>Λάθος:</strong> ${m.question} <span class="text-rose-600">(Έδωσε: ${m.studentAns} | Σωστό: ${m.correctAns})</span>
                          <div class="text-slate-500 italic">Αιτία: ${m.reason}</div>
                        </div>
                      `).join('')}
                    </div>
                  ` : `<div class="text-xs text-emerald-600 font-semibold">✨ Άριστη επίδοση χωρίς λάθη!</div>`}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Boot Application
    render();
  </script>
</body>
</html>
