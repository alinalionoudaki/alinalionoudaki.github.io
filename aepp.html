    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      const el = document.createElement('div');
      const styles = {
        success: 'bg-emerald-600 text-white',
        info: 'bg-indigo-600 text-white',
        warning: 'bg-amber-500 text-slate-950',
        error: 'bg-rose-600 text-white'
      };
      el.className = `${styles[type] || styles.info} px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all transform translate-y-2 opacity-0 pointer-events-auto`;
      el.innerHTML = `<span>${type === 'success' ? '✅' : type === 'error' ? '⛔' : type === 'warning' ? '⚠️' : 'ℹ️'}</span><span>${msg}</span>`;
      box.appendChild(el);
      requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => {
        el.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function handleLogin(e) {
      e.preventDefault();
      const uname = document.getElementById('login-username').value.trim().toLowerCase();
      const pass = document.getElementById('login-password').value.trim();

      const found = state.users.find(u => u.username.toLowerCase() === uname && u.password === pass);
      if (!found) {
        showToast('Λάθος όνομα χρήστη ή κωδικός πρόσβασης!', 'error');
        return;
      }
      if (!found.active) {
        showToast('Ο λογαριασμός σας έχει απενεργοποιηθεί από τον εκπαιδευτικό.', 'error');
        return;
      }
      state.currentUser = found;
      state.activeNav = found.role === 'teacher' ? 'admin' : 'home';
      persistAll();
      showToast(`Καλώς ήρθες, ${found.fullName}!`, 'success');
      render();
    }

    function logout() {
      if (timerHandle) clearInterval(timerHandle);
      state.currentUser = null;
      persistAll();
      render();
    }

    function addNewStudent(e) {
      e.preventDefault();
      const fullName = document.getElementById('new-st-name').value.trim();
      const username = document.getElementById('new-st-user').value.trim().toLowerCase();
      const password = document.getElementById('new-st-pass').value.trim();

      if (!fullName || !username || !password) {
        showToast('Συμπλήρωσε όλα τα πεδία του μαθητή!', 'warning');
        return;
      }
      if (state.users.some(u => u.username.toLowerCase() === username)) {
        showToast('Υπάρχει ήδη χρήστης με αυτό το username!', 'error');
        return;
      }

      state.users.push({
        id: 'u_' + Date.now(),
        username,
        password,
        fullName,
        role: 'student',
        active: true
      });
      persistAll();
      showToast(`Ο μαθητής "${fullName}" προστέθηκε επιτυχώς!`, 'success');
      render();
    }

    function toggleUserStatus(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user || user.role === 'teacher') return;
      user.active = !user.active;
      persistAll();
      showToast(user.active ? `Ενεργοποιήθηκε η πρόσβαση για: ${user.fullName}` : `Απενεργοποιήθηκε η πρόσβαση για: ${user.fullName}`, 'info');
      render();
    }

    function deleteUser(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user || user.role === 'teacher') return;
      state.users = state.users.filter(u => u.id !== userId);
      persistAll();
      showToast(`Ο χρήστης "${user.fullName}" διαγράφηκε οριστικά από την πλατφόρμα.`, 'warning');
      render();
    }

    function updateTeacherEmail(val) {
      state.teacherEmail = val.trim() || 'teacher_aepp@sch.gr';
      persistAll();
      showToast(`Το Email εκπαιδευτικού ορίστηκε σε: ${state.teacherEmail}`, 'success');
    }

    function enrichContentSubmit(e) {
      e.preventDefault();
      const chId = document.getElementById('enrich-chapter').value;
      const type = document.getElementById('enrich-type').value;
      const title = document.getElementById('enrich-title').value.trim();
      const body = document.getElementById('enrich-body').value.trim();
      const extra = document.getElementById('enrich-extra').value.trim();

      if (!title || !body) {
        showToast('Συμπλήρωσε τίτλο και περιεχόμενο!', 'warning');
        return;
      }

      const chapter = state.chapters.find(c => c.id === chId);
      if (!chapter) return;

      if (type === 'theory') {
        chapter.subsections.push({
          id: 'sub_' + Date.now(),
          title: title,
          summary: `<p class="whitespace-pre-line">${body}</p>${extra ? `<pre class="mt-2 bg-slate-900 text-emerald-300 p-3 rounded-xl text-xs code-font overflow-x-auto">${extra}</pre>` : ''}`
        });
      } else if (type === 'tf') {
        chapter.theoryExercises.trueFalse.push({
          id: 'tf_' + Date.now(),
          statement: body,
          correct: extra.toLowerCase().startsWith('σ') || extra.toLowerCase() === 'true',
          hint: title
        });
      } else if (type === 'code') {
        chapter.practicalExercises.codeCreation = {
          title: title,
          prompt: body,
          starter: "ΠΡΟΓΡΑΜΜΑ Νέα_Άσκηση\nΜΕΤΑΒΛΗΤΕΣ\n  ...\nΑΡΧΗ\n  ...\nΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ",
          solution: extra || "Ενδεικτική λύση καταχωρημένη από τον εκπαιδευτικό."
        };
      } else if (type === 'test_q') {
        const opts = extra.split('|').map(s => s.trim()).filter(Boolean);
        if (opts.length < 2) {
          showToast('Για ερώτηση τεστ βάλε επιλογές χωρισμένες με | (π.χ. Επιλογή 1 | Επιλογή 2)', 'warning');
          return;
        }
        chapter.tests[0].questions.push({
          q: body,
          options: opts,
          correct: 0,
          errorReason: `Δυσκολία στην έννοια: ${title}`
        });
      }

      persistAll();
      showToast('Το νέο εκπαιδευτικό υλικό προστέθηκε στο κεφάλαιο!', 'success');
      document.getElementById('enrich-title').value = '';
      document.getElementById('enrich-body').value = '';
      document.getElementById('enrich-extra').value = '';
    }

    function setNav(nav, chId = null, tab = null) {
      state.activeNav = nav;

    function openEmailReportModal(logId) {
      const log = state.logs.find(l => l.id === logId);
      if (!log) return;

      const mistakesText = log.mistakes && log.mistakes.length > 0
        ? log.mistakes.map((m, i) => `${i + 1}. Ερώτηση: ${m.question}\n   - Απάντηση μαθητή: ${m.studentAns}\n   - Σωστή απάντηση: ${m.correctAns}\n   - Πιθανή αιτία λάθους: ${m.reason}`).join('\n\n')
        : 'Κανένα λάθος! Άριστη κατανόηση της ενότητας.';

      const emailBody = `Αναφορά Αξιολόγησης ΑΕΠΠ (Γ' Λυκείου)\n` +
        `--------------------------------------------------\n` +
        `Μαθητής/τρια: ${log.studentName}\n` +
        `Ενότητα: ${log.chapterTitle}\n` +
        `Διαγνωστικό Τεστ: ${log.testTitle}\n` +
        `Βαθμολογία: ${log.score}% (${log.correct}/${log.total} σωστές απαντήσεις)\n` +
        `Ημερομηνία/Ώρα: ${log.date}\n\n` +
        `ΑΝΑΛΥΣΗ ΛΑΘΩΝ & ΔΙΑΓΝΩΣΤΙΚΟ FEEDBACK:\n${mistakesText}\n` +
        `--------------------------------------------------\n` +
        `Αυτόματη αναφορά από την πλατφόρμα ΑΕΠΠ Πανελλαδικές.`;

      state.lastEmailReportText = emailBody;

      const subject = encodeURIComponent(`[ΑΕΠΠ Αξιολόγηση] ${log.studentName} - ${log.testTitle} (${log.score}%)`);
      const bodyEncoded = encodeURIComponent(emailBody);
      const mailtoHref = `mailto:${state.teacherEmail}?subject=${subject}&body=${bodyEncoded}`;

      document.getElementById('email-modal-body').innerHTML = `
        <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 text-xs space-y-1">
          <div><strong class="text-slate-500">Προς (Email Εκπαιδευτικού):</strong> <span class="font-mono font-bold text-indigo-700">${state.teacherEmail}</span></div>

        </div>
        <pre class="bg-slate-900 text-slate-100 p-4 rounded-2xl text-xs whitespace-pre-wrap leading-relaxed font-sans">${emailBody}</pre>
      `;

      document.getElementById('mailto-trigger-link').href = mailtoHref;
      document.getElementById('email-modal').classList.remove('hidden');
      document.getElementById('email-modal').classList.add('flex');
    }

    // =========================================================================
    // 11. CHAPTER WORKSPACE (THEORY, THEORETICAL EX, PRACTICAL EX, TESTS)
    // =========================================================================

    function renderChapterWorkspace() {
      const ch = state.chapters.find(c => c.id === state.selectedChapterId) || state.chapters[0];
      const isTeacher = state.currentUser.role === 'teacher';

      return `
        <div class="space-y-6">
          <!-- Chapter Horizontal Selector (All 11 FEK Units in exact order) -->
          <div class="flex items-center gap-2 overflow-x-auto pb-2">
            ${state.chapters.map(c => `
              <button onclick="setNav('chapter', '${c.id}')"
                class="px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition ${c.id === ch.id ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                ${c.icon} ${c.num}: ${c.title}

          <!-- Chapter Card Container -->
          <div class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-7 shadow-sm">
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-5 border-b border-slate-100">

                <div class="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">${ch.num} • Εντός Ύλης ΦΕΚ</div>

              <!-- 4 Core Submenu Tabs -->

                <button onclick="switchChapterTab('theory')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.chapterTab === 'theory' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  📖 Θεωρία Υποενοτήτων
                </button>
                <button onclick="switchChapterTab('theory_ex')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.chapterTab === 'theory_ex' ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  ✓ Θεωρητικές Ασκήσεις
                </button>
                <button onclick="switchChapterTab('practical_ex')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.chapterTab === 'practical_ex' ? 'bg-white text-amber-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  💻 Ασκήσεις Κώδικα & Ροής
                </button>
                <button onclick="switchChapterTab('tests')" class="px-3.5 py-2 rounded-xl text-xs font-bold transition ${state.chapterTab === 'tests' ? 'bg-white text-rose-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}">
                  🎯 Τεστ Επανάληψης (${ch.tests.length})

            </div>

            <div class="pt-6">

              ${state.chapterTab === 'tests' ? renderChapterTestsTab(ch) : ''}

    function switchChapterTab(tab) {
      state.chapterTab = tab;
      render();

    // --- TAB 1: THEORY WITH SUBSECTIONS ---
    function renderTheoryTab(ch) {
      return `
        <div class="grid lg:grid-cols-4 gap-6">
          <div class="lg:col-span-1 space-y-1.5">
            <div class="text-[11px] font-extrabold uppercase tracking-wider text-slate-400 px-2 mb-2">Υποενότητες ΦΕΚ</div>
            ${ch.subsections.map(sub => {
              const active = sub.id === state.selectedSubId;
              return `
                <button onclick="selectSub('${sub.id}')"
                  class="w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-bold transition ${active ? 'bg-indigo-50 text-indigo-800 border border-indigo-200' : 'text-slate-600 hover:bg-slate-50'}">
                  ${sub.title}
                </button>
              `;
            }).join('')}
          </div>

          <div class="lg:col-span-3 space-y-5">
            ${ch.subsections.map(sub => `
              <div id="${sub.id}" class="p-5 rounded-2xl border ${sub.id === state.selectedSubId ? 'border-indigo-300 bg-indigo-50/20 shadow-sm' : 'border-slate-200 bg-white'}">
                <h3 class="text-base sm:text-lg font-extrabold text-slate-900 mb-3">${sub.title}</h3>
                <div class="text-sm text-slate-700 leading-relaxed">${sub.summary}</div>
              </div>
            `).join('')}

            <div class="bg-slate-900 text-white p-5 rounded-2xl flex flex-wrap items-center justify-between gap-4">
              <div>
                <div class="font-bold text-sm">Ολοκλήρωσες το διάβασμα της θεωρίας;</div>
                <p class="text-xs text-slate-300">Συνέχισε στις Θεωρητικές Ασκήσεις ή κάνε ένα από τα Τεστ Επανάληψης!</p>
              </div>
              <div class="flex gap-2">
                <button onclick="switchChapterTab('theory_ex')" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs transition">
                  Θεωρητικές Ασκήσεις →
                </button>
                <button onclick="switchChapterTab('tests')" class="px-4 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white font-bold text-xs transition">

                </button>
              </div>
            </div>
          </div>
        </div>

    function selectSub(subId) {
      state.selectedSubId = subId;
      render();
      const el = document.getElementById(subId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // --- TAB 2: THEORETICAL EXERCISES ---
    function renderTheoreticalExercisesTab(ch) {
      const te = ch.theoryExercises;
      const rightOptions = te.matching.map(m => m.right);

      return `
        <div class="space-y-8">
          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
            <h3 class="text-base font-extrabold text-slate-900 mb-3">1️⃣ Ασκήσεις Σωστού / Λάθους</h3>
            <div class="space-y-3">
              ${te.trueFalse.map((item, idx) => {
                const ans = state.tfAnswers[item.id];
                const isAnswered = ans !== undefined;
                const isRight = ans === item.correct;
                return `
                  <div class="bg-white p-4 rounded-xl border ${isAnswered ? (isRight ? 'border-emerald-300' : 'border-rose-300') : 'border-slate-200'}">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <p class="text-sm font-medium text-slate-800">${idx + 1}. ${item.statement}</p>
                      <div class="flex items-center gap-2 shrink-0">
                        <button onclick="answerTF('${item.id}', true)" class="px-3.5 py-1.5 rounded-lg text-xs font-bold border transition ${ans === true ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-300'}">
                          Σωστό
                        </button>
                        <button onclick="answerTF('${item.id}', false)" class="px-3.5 py-1.5 rounded-lg text-xs font-bold border transition ${ans === false ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-300'}">
                          Λάθος
                        </button>
                      </div>
                    </div>
                    ${isAnswered ? `
                      <div class="mt-2 text-xs font-semibold ${isRight ? 'text-emerald-700' : 'text-rose-700'}">
                        ${isRight ? '✅ Σωστά!' : '❌ Λάθος.'} ${item.hint}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
            <h3 class="text-base font-extrabold text-slate-900 mb-3">2️⃣ Άσκηση Αντιστοίχισης</h3>
            <div class="space-y-3">
              ${te.matching.map((m, idx) => {
                const chosen = state.matchAnswers[m.id] || '';
                const isChecked = chosen !== '';
                const isRight = chosen === m.right;
                return `
                  <div class="bg-white p-4 rounded-xl border ${isChecked ? (isRight ? 'border-emerald-300' : 'border-rose-300') : 'border-slate-200'} grid sm:grid-cols-2 gap-3 items-center">
                    <div class="font-bold text-xs sm:text-sm text-indigo-900">${idx + 1}. ${m.left}</div>
                    <div>
                      <select onchange="answerMatch('${m.id}', this.value)" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm bg-slate-50 focus:border-indigo-500 outline-none">
                        <option value="">-- Επίλεξε αντιστοίχιση --</option>
                        ${rightOptions.map(opt => `<option value="${opt}" ${chosen === opt ? 'selected' : ''}>${opt}</option>`).join('')}
                      </select>
                      ${isChecked ? `<div class="mt-1 text-[11px] font-bold ${isRight ? 'text-emerald-600' : 'text-rose-600'}">${isRight ? '✅ Σωστή αντιστοίχιση!' : '❌ Δοκίμασε ξανά'}</div>` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
            <h3 class="text-base font-extrabold text-slate-900 mb-3">3️⃣ Συμπλήρωση Κενού</h3>
            <div class="space-y-3">
              ${te.fillBlank.map((fb, idx) => {
                const val = state.fbAnswers[fb.id] || '';
                const isCorrect = val.trim().toLowerCase() === fb.answer.toLowerCase();
                return `
                  <div class="bg-white p-4 rounded-xl border border-slate-200 text-sm leading-loose">
                    <span>${idx + 1}. ${fb.before} </span>
                    <input type="text" value="${val}" oninput="answerFB('${fb.id}', this.value)" placeholder="..."
                      class="px-3 py-1 rounded-lg border-2 ${val ? (isCorrect ? 'border-emerald-500 bg-emerald-50 text-emerald-900' : 'border-amber-400 bg-amber-50') : 'border-indigo-300'} font-bold text-center w-40 outline-none text-xs sm:text-sm" />
                    <span> ${fb.after}</span>
                    ${val && isCorrect ? '<span class="ml-2 text-xs font-bold text-emerald-600">✅ Άριστα!</span>' : ''}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function answerTF(id, val) { state.tfAnswers[id] = val; render(); }
    function answerMatch(id, val) { state.matchAnswers[id] = val; render(); }
    function answerFB(id, val) { state.fbAnswers[id] = val; render(); }

    // --- TAB 3: PRACTICAL EXERCISES ---
    function renderPracticalExercisesTab(ch, isTeacher) {
      const pe = ch.practicalExercises;
      const codeKey = `${ch.id}_code`;
      const currentCode = state.studentCodeDrafts[codeKey] !== undefined ? state.studentCodeDrafts[codeKey] : pe.codeCreation.starter;
      const gfc = pe.guidedFillCode;
      const isGuidedChecked = gfc ? !!state.guidedChecked[ch.id] : false;

      return `
        <div class="space-y-8">
          ${gfc ? `
            <div class="bg-indigo-50/40 border-2 border-indigo-200 rounded-2xl p-5 shadow-sm space-y-4">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <span class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white font-extrabold text-xs">✨ Καθοδηγούμενη Υλοποίηση με Κενά</span>
                <span class="text-xs font-semibold text-indigo-800">Συμπλήρωσε τα κενά του αλγορίθμου</span>

              <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
                ${gfc.blanks.map(b => {
                  const val = state.guidedBlankAnswers[b.id] || '';
                  const ok = val.trim().toLowerCase() === b.answer.toLowerCase();
                  return `
                    <div class="bg-white p-3 rounded-xl border ${isGuidedChecked ? (ok ? 'border-emerald-400 bg-emerald-50/40' : 'border-rose-400 bg-rose-50/40') : 'border-slate-200'}">
                      <label class="block text-[11px] font-bold text-slate-600 mb-1">${b.label}</label>
                      <input type="text" value="${val}" oninput="saveGuidedBlank('${b.id}', this.value)" placeholder="Συμπλήρωσε..."
                        class="w-full px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-mono font-bold outline-none focus:border-indigo-500" />
                      ${isGuidedChecked ? `
                        <div class="mt-1 text-[11px] font-bold ${ok ? 'text-emerald-700' : 'text-rose-700'}">
                          ${ok ? '✅ Σωστό!' : `❌ Σωστό: ${b.answer}`}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>

              <div class="flex flex-wrap items-center gap-3">
                <button onclick="checkGuidedBlanks('${ch.id}')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition shadow">
                  ✓ Έλεγχος Κενών & Εμφάνιση Σωστού
                </button>
                ${(isGuidedChecked || isTeacher) ? `
                  <div class="w-full mt-2 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 text-xs">
                    <div class="font-extrabold text-emerald-900 mb-1">✅ Ολοκληρωμένος Σωστός Κώδικας:</div>
                    <pre class="bg-slate-900 text-emerald-300 p-3 rounded-lg code-font overflow-x-auto">${gfc.fullSolution}</pre>
                  </div>
                ` : ''}
              </div>
            </div>
          ` : ''}

          <div class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
            <div class="flex items-center justify-between mb-2">
              <span class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 font-extrabold text-xs">1. Ελεύθερη Δημιουργία Κώδικα (ΓΛΩΣΣΑ)</span>
              <span class="text-xs text-slate-400">${isTeacher ? '🔓 Λύση ορατή στον εκπαιδευτικό' : '🔒 Η λύση είναι κρυφή για τον μαθητή'}</span>
            </div>
            <h3 class="text-base font-extrabold text-slate-900 mb-1">${pe.codeCreation.title}</h3>
            <p class="text-sm text-slate-600 mb-3">${pe.codeCreation.prompt}</p>
            <textarea rows="8" oninput="saveCodeDraft('${codeKey}', this.value)"
              class="w-full p-4 rounded-xl bg-slate-900 text-emerald-300 code-font text-xs leading-relaxed outline-none focus:ring-2 focus:ring-indigo-500">${currentCode}</textarea>
            ${isTeacher ? `
              <div class="mt-3 p-3.5 rounded-xl bg-rose-50 border border-rose-200">
                <div class="text-xs font-extrabold text-rose-800 mb-1">👩‍🏫 Ενδεικτική Λύση Καθηγητή:</div>
                <pre class="bg-slate-900 text-slate-100 p-3 rounded-lg text-xs code-font overflow-x-auto">${pe.codeCreation.solution}</pre>
              </div>
            ` : ''}

    function renderChapterTestsTab(ch) {
      const test = ch.tests[state.activeTestIndex] || ch.tests[0];
      const submitted = !!state.testSubmitted[test.id];
      const sel = state.testSelections[test.id] || {};

      let correctCount = 0;
      if (submitted) {
        test.questions.forEach((q, idx) => {
          if (sel[idx] === q.correct) correctCount++;
        });
      }

      const matchingLog = submitted
        ? state.logs.find(l => l.testTitle === test.title && l.studentName === state.currentUser.fullName)
        : null;

      return `
        <div class="space-y-6">
          <div class="flex flex-wrap gap-2">
            ${ch.tests.map((t, idx) => `
              <button onclick="selectTest(${idx})" class="px-4 py-2 rounded-xl text-xs font-bold transition ${state.activeTestIndex === idx ? 'bg-rose-600 text-white shadow' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                🎯 ${t.title}
              </button>
            `).join('')}
          </div>

          <div class="bg-slate-50 rounded-2xl border border-slate-200 p-5 sm:p-6">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-5 pb-3 border-b border-slate-200">
              <div>
                <h3 class="text-lg font-extrabold text-slate-900">${test.title}</h3>
                <p class="text-xs text-slate-500">Επίλεξε μία απάντηση σε κάθε ερώτηση και πάτησε «Υποβολή & Αξιολόγηση».</p>
              </div>
              ${submitted ? `
                <div class="px-4 py-2 rounded-xl bg-white border border-indigo-200 text-sm font-extrabold text-indigo-700 shadow-sm">
                  Βαθμολογία: ${Math.round((correctCount / test.questions.length) * 100)}% (${correctCount}/${test.questions.length})
                </div>
              ` : ''}
            </div>

            <div class="space-y-5">
              ${test.questions.map((q, qIdx) => {
                const chosen = sel[qIdx];
                return `
                  <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="font-bold text-sm text-slate-900 mb-3">${qIdx + 1}. ${q.q}</div>
                    <div class="grid sm:grid-cols-2 gap-2.5">
                      ${q.options.map((opt, oIdx) => {
                        let btnStyle = 'border-slate-200 hover:border-indigo-300 bg-slate-50/50 text-slate-700';
                        if (!submitted && chosen === oIdx) {
                          btnStyle = 'border-indigo-600 bg-indigo-50 text-indigo-900 font-bold';
                        } else if (submitted) {
                          if (oIdx === q.correct) {
                            btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold';
                          } else if (chosen === oIdx && oIdx !== q.correct) {
                            btnStyle = 'border-rose-500 bg-rose-50 text-rose-900 font-bold';
                          } else {
                            btnStyle = 'border-slate-200 opacity-60';
                          }
                        }
                        return `
                          <button ${submitted ? 'disabled' : ''} onclick="pickTestOption('${test.id}', ${qIdx}, ${oIdx})"
                            class="text-left px-3.5 py-2.5 rounded-xl border text-xs sm:text-sm transition flex items-center gap-2 ${btnStyle}">
                            <span class="w-5 h-5 rounded-full border flex items-center justify-center text-[10px] font-bold shrink-0">${String.fromCharCode(913 + oIdx)}</span>
                            <span>${opt}</span>
                          </button>
                        `;
                      }).join('')}
                    </div>

                    ${submitted && chosen !== q.correct ? `
                      <div class="mt-3 p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-rose-800">
                        <strong>⚠️ Ανάλυση λάθους:</strong> ${q.errorReason}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="mt-6 flex flex-wrap items-center justify-between gap-3">
              ${!submitted ? `
                <button onclick="submitChapterTest('${ch.id}', '${test.id}')" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-lg shadow-indigo-200 transition">
                  ✅ Υποβολή & Αξιολόγηση Τεστ
                </button>
              ` : `
                <div class="flex flex-wrap items-center gap-3">
                  <button onclick="retryChapterTest('${test.id}')" class="px-4 py-2.5 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs sm:text-sm transition">
                    🔄 Επανάληψη Τεστ
                  </button>
                  ${matchingLog ? `
                    <button onclick="openEmailReportModal('${matchingLog.id}')" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md transition flex items-center gap-2">

                </div>
              `}
            </div>
          </div>
        </div>
      `;

    function selectTest(idx) { state.activeTestIndex = idx; render(); }
    function pickTestOption(testId, qIdx, oIdx) {
      if (!state.testSelections[testId]) state.testSelections[testId] = {};
      state.testSelections[testId][qIdx] = oIdx;
      render();
    }
    function retryChapterTest(testId) {
      delete state.testSubmitted[testId];
      delete state.testSelections[testId];
      render();
    }

    function submitChapterTest(chId, testId) {
      const ch = state.chapters.find(c => c.id === chId);
      const test = ch.tests.find(t => t.id === testId);
      const sel = state.testSelections[testId] || {};

      if (Object.keys(sel).length < test.questions.length) {
        showToast('Απάντησε σε όλες τις ερωτήσεις πριν την υποβολή!', 'warning');
        return;
      }

      state.testSubmitted[testId] = true;

      let correct = 0;
      const mistakes = [];
      test.questions.forEach((q, idx) => {
        if (sel[idx] === q.correct) {
          correct++;
        } else {
          mistakes.push({
            question: q.q,
            studentAns: q.options[sel[idx]],
            correctAns: q.options[q.correct],
            reason: q.errorReason
          });
        }
      });

      const score = Math.round((correct / test.questions.length) * 100);
      const newLogId = 'lg_' + Date.now();
      state.logs.unshift({
        id: newLogId,
        studentName: state.currentUser.fullName,
        chapterTitle: `${ch.num}: ${ch.title}`,
        testTitle: test.title,
        score,
        correct,
        total: test.questions.length,
        date: 'Μόλις τώρα',
        mistakes
      });

      persistAll();
      render();
      openEmailReportModal(newLogId);
    }

    function startExamTimer(examId) {
      if (!state.examState[examId]) {
        state.examState[examId] = { started: true, finished: false, secondsLeft: 45 * 60, answers: {} };
      } else {
        state.examState[examId].started = true;
      }

      if (timerHandle) clearInterval(timerHandle);
      timerHandle = setInterval(() => {
        let anyRunning = false;
        Object.keys(state.examState).forEach(id => {
          const st = state.examState[id];
          if (st.started && !st.finished) {
            anyRunning = true;
            if (st.secondsLeft > 0) {
              st.secondsLeft--;
            } else {
              st.finished = true;
              st.started = false;
              showToast('Ο χρόνος εξάσκησης ολοκληρώθηκε! Εμφανίστηκαν οι λύσεις.', 'warning');
            }
          }
        });
        if (!anyRunning) clearInterval(timerHandle);
        if (state.activeNav === 'exams') render();
      }, 1000);

      render();
    }

    function saveExamAnswer(examId, qId, val) {
      if (!state.examState[examId]) {
        state.examState[examId] = { started: false, finished: false, secondsLeft: 45 * 60, answers: {} };
      }
      state.examState[examId].answers[qId] = val;
    }

    function finishExam(examId) {
      if (!state.examState[examId]) {
        state.examState[examId] = { started: false, finished: true, secondsLeft: 45 * 60, answers: {} };
      } else {
        state.examState[examId].finished = true;
        state.examState[examId].started = false;
      }
      showToast('Οι ασκήσεις ολοκληρώθηκαν! Εμφανίστηκαν οι προτεινόμενες λύσεις.', 'success');
      render();
    }

    function resetExam(examId) {
      state.examState[examId] = { started: false, finished: false, secondsLeft: 45 * 60, answers: {} };
      render();
    }

                <label class="block text-xs font-bold text-slate-700 mb-1">Email Εκπαιδευτικού:</label>
                <input type="email" value="${state.teacherEmail}" onchange="updateTeacherEmail(this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-mono outline-none focus:border-indigo-500 mb-3" />
                <div class="p-3 rounded-xl bg-indigo-50 text-xs text-indigo-900">
                  💡 <strong>Tip:</strong> Πατήστε <em>«Αποστολή Email»</em> σε οποιαδήποτε αναφορά παρακάτω για να ανοίξει προσυμπληρωμένο το μήνυμα.
                </div>
              </div>
            </div>
          </div>

          <!-- 2. CONTENT ENRICHMENT TOOL -->
          <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-7 shadow-sm">
            <h2 class="text-lg font-extrabold text-slate-900 mb-1">➕ Εμπλουτισμός Εκπαιδευτικού Υλικού (Θεωρία, Ασκήσεις, Τεστ)</h2>
            <p class="text-xs text-slate-500 mb-5">Προσθέστε νέες ενότητες θεωρίας, προτάσεις Σωστού/Λάθους, ασκήσεις κώδικα στη ΓΛΩΣΣΑ ή ερωτήσεις τεστ σε οποιοδήποτε κεφάλαιο.</p>

            <form onsubmit="enrichContentSubmit(event)" class="grid md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Επιλογή Κεφαλαίου ΦΕΚ:</label>
                <select id="enrich-chapter" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 outline-none">
                  ${state.chapters.map(c => `<option value="${c.id}">${c.num}: ${c.title}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Είδος Υλικού προς Προσθήκη:</label>
                <select id="enrich-type" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-slate-50 outline-none">
                  <option value="theory">📖 Νέα Υποενότητα Θεωρίας</option>
                  <option value="tf">✓ Πρόταση Σωστού / Λάθους</option>
                  <option value="code">💻 Άσκηση Δημιουργίας Κώδικα (ΓΛΩΣΣΑ)</option>
                  <option value="test_q">🎯 Ερώτηση Πολλαπλής Επιλογής σε Τεστ</option>
                </select>
              </div>
              <div class="md:col-span-2">
                <label class="block text-xs font-bold text-slate-700 mb-1">Τίτλος Υποενότητας / Αιτιολόγηση Hint:</label>
                <input type="text" id="enrich-title" required placeholder="π.χ. Ειδικές περιπτώσεις ταξινόμησης ή Αιτιολόγηση απάντησης"
                  class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm outline-none focus:border-indigo-500" />
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Κύριο Κείμενο / Εκφώνηση:</label>
                <textarea id="enrich-body" rows="3" required placeholder="Γράψε το κείμενο θεωρίας ή την εκφώνηση..."
                  class="w-full p-3.5 rounded-xl border border-slate-300 text-sm outline-none focus:border-indigo-500"></textarea>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Λύση Κώδικα / «Σωστό» ή «Λάθος» / Επιλογές Τεστ (με |):</label>
                <textarea id="enrich-extra" rows="3" placeholder="Για Σ/Λ γράψε: Σωστό ή Λάθος • Για Τεστ: Σωστή | Λάθος 1 | Λάθος 2"
                  class="w-full p-3.5 rounded-xl border border-slate-300 text-sm code-font outline-none focus:border-indigo-500"></textarea>
              </div>
              <div class="md:col-span-2">
                <button type="submit" class="px-6 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow transition">
                  💾 Αποθήκευση & Δημοσίευση στην Πλατφόρμα
                </button>
              </div>
            </form>
          </div>

          <!-- 3. DIAGNOSTIC LOGS & EMAIL REPORTS -->
          <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-7 shadow-sm">
            <h2 class="text-lg font-extrabold text-slate-900 mb-4">📊 Ιστορικό Διαγνωστικών Τεστ & Αναφορές Email</h2>
            <div class="space-y-4">
              ${state.logs.map(lg => `
                <div class="p-4 sm:p-5 rounded-2xl bg-slate-50 border border-slate-200">
                  <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
                    <div>
                      <span class="font-extrabold text-slate-900 text-sm sm:text-base">${lg.studentName}</span>
                      <span class="mx-2 text-slate-300">•</span>
                      <span class="text-xs font-bold text-indigo-700">${lg.chapterTitle} — ${lg.testTitle}</span>
                    </div>
                    <div class="flex items-center gap-2.5">
                      <span class="px-3 py-1 rounded-full text-xs font-extrabold ${lg.score >= 70 ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                        Σκορ: ${lg.score}% (${lg.correct}/${lg.total})
                      </span>
                      <button onclick="openEmailReportModal('${lg.id}')" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs transition shadow-sm">
                        📧 Αποστολή Email
                      </button>
                    </div>
                  </div>
                  <div class="text-[11px] text-slate-400 mb-2">${lg.date}</div>
                  ${lg.mistakes && lg.mistakes.length > 0 ? `
                    <div class="mt-2 space-y-1.5">
                      ${lg.mistakes.map(m => `
                        <div class="p-2.5 rounded-xl bg-white border border-rose-200 text-xs">
                          <div class="font-bold text-slate-800">Ερώτηση: ${m.question}</div>
                          <div class="text-rose-700 mt-0.5">Απάντηση: <strong>${m.studentAns}</strong> (Σωστό: ${m.correctAns}) — <em>${m.reason}</em></div>
                        </div>
                      `).join('')}
                    </div>
                  ` : '<div class="text-xs font-bold text-emerald-700">✅ Χωρίς κανένα λάθος!</div>'}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    // Boot App
    render();
  </script>
</body>
</html>
